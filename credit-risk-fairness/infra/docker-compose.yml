services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: credit
      POSTGRES_DB: creditrisk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit -d creditrisk"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://credit:credit@postgres:5432/creditrisk
      CORS_ORIGINS: http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:5174
      BIAS_MAX_DI_DEVIATION: "0.65"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ../frontend
    ports:
      - "8080:80"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: credit
    ports:
      - "3001:3000"
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  grafana:

