name: Credit Risk Fairness CI

on:
  push:
    paths:
      - "credit-risk-fairness/**"
      - ".github/workflows/credit-risk-ci.yml"
  pull_request:
    paths:
      - "credit-risk-fairness/**"
      - ".github/workflows/credit-risk-ci.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: credit-risk-fairness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run API and bias regression tests
        env:
          BIAS_MAX_DI_DEVIATION: "0.65"
        run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Build dashboard
        working-directory: .
        run: |
          cd ..
          npm ci
          npm run credit:build
